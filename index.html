<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="con">
        <a href="https://github.com/pisitponjanton" target="_blank" id="uu" class="hh">MR.PISITPON JANTON 67070119</a>
        <div class="img" id="tt">
            <div class="n">
                <p>1</p>
            </div>
        </div>
    </div>
    <div class="con">
        <div class="inpp">
            <p>Set the Username :</p>
            <input id="username" type="text">
            <button onclick="U()">SET</button>
            <p>Set the URL :</p>
            <input type="text" id="urll1">
            <button onclick="ur()">SET</button>
        </div>
        <h1>Phone Number List</h1>
        <div class="inpp1">
            <input id="name" placeholder="name" type="text">
            <input id="Tel" placeholder="Tel" type="text">
            <button onclick="addPhoneNumber()">ADD</button>
            <button onclick="exportToCSV()">EXPORT</button>
        </div>
    </div>
    <div class="con22">
        <div class="con2"><h4>No</h4><h4>Name</h4><h4>Phone</h4></div>
    </div>
</body>
<script>
    let count = 0; 
    const phoneBook = {}; 
    function U(){
        event.preventDefault();
        const username = document.getElementById("username").value;
        document.getElementById("uu").innerHTML = username;
    }
    function ur(){
        event.preventDefault();
        const uuu = document.getElementById("urll1").value;
        document.getElementById("tt").style.backgroundImage = `url(${uuu})`;
    }
    function addPhoneNumber() {
            const name = document.getElementById("name").value;
            const tel = document.getElementById("Tel").value;
            if (name && tel) {
                count++;
                phoneBook[count] = { name: name, phone: tel };
                const phoneList = document.querySelector('.con22');
                const entryDiv = document.createElement('div');
                entryDiv.className = 'con2';
                entryDiv.innerHTML = `<h4>${count}</h4><h4>${name}</h4><h4>${tel}</h4>`;
                phoneList.appendChild(entryDiv);
                document.getElementById("name").value = '';
                document.getElementById("Tel").value = '';
            }else {
                alert("Please enter both name and phone number.");
            }
    }
    function exportToCSV() {
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "No,Name,Phone\n";
            for (let key in phoneBook) {
                const entry = phoneBook[key];
                const row = `${key},${entry.name},${entry.phone}`;
                csvContent += row + "\n";
            }
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "phone_book.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
</script>
</html>
